apply plugin: 'com.android.application'

// Round 21: one place for versions and signing (see docs/OPERATIONS.md, "Google Play releases").
//  - Version name: "version" in apps/APP/package.json, plus ANDROID_VERSION_SUFFIX (test builds: "-test.<run>").
//  - Version code: ANDROID_VERSION_CODE, else the GitHub Actions run number (always rising within the Android workflow).
//  - Signing: the private upload key when DINGOGO_UPLOAD_STORE_FILE is set (GitHub Actions secrets, never in the repo),
//    otherwise the shared TEST key so test APKs keep installing over each other. DINGOGO_REQUIRE_UPLOAD_KEY=true (the Play
//    bundle job) stops the build instead of falling back to the test key.
def envOr = { String k -> def v = System.getenv(k); v ? v : null }
def appPackage = new groovy.json.JsonSlurper().parse(rootProject.file('../package.json'))
def appVersionCode = Integer.parseInt(envOr('ANDROID_VERSION_CODE') ?: envOr('GITHUB_RUN_NUMBER') ?: '1')
def appVersionName = appPackage.version + (envOr('ANDROID_VERSION_SUFFIX') ?: '')
def uploadStoreFile = envOr('DINGOGO_UPLOAD_STORE_FILE')
if (!uploadStoreFile && envOr('DINGOGO_REQUIRE_UPLOAD_KEY') == 'true') {
    throw new GradleException('DINGOGO_REQUIRE_UPLOAD_KEY is set but DINGOGO_UPLOAD_STORE_FILE is not: refusing to sign a Play build with the test key.')
}

android {
    namespace = "au.com.dingogo.rider"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "au.com.dingogo.rider"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersionCode
        versionName appVersionName
        // Android App Links: the website's share-trip (/track/...) and booking (/rider/...) links open the app (see AndroidManifest.xml).
        manifestPlaceholders = [appLinkHost: envOr('DINGOGO_APP_LINK_HOST') ?: 'dingogo-steel.vercel.app']
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // Shared TEST signing key (committed on purpose, see android-signing/README.md) so test builds update in place.
    // Google Play releases use the private upload key from the environment (never committed).
    signingConfigs {
        test {
            storeFile rootProject.file('../../../android-signing/dingogo-test.keystore')
            storePassword 'dingogo-test'
            keyAlias 'dingogo-test'
            keyPassword 'dingogo-test'
        }
        if (uploadStoreFile) {
            upload {
                storeFile file(uploadStoreFile)
                storePassword envOr('DINGOGO_UPLOAD_STORE_PASSWORD')
                keyAlias envOr('DINGOGO_UPLOAD_KEY_ALIAS')
                keyPassword envOr('DINGOGO_UPLOAD_KEY_PASSWORD') ?: envOr('DINGOGO_UPLOAD_STORE_PASSWORD')
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.test
        }
        release {
            signingConfig uploadStoreFile ? signingConfigs.upload : signingConfigs.test
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
