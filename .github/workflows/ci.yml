name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: dingogo, POSTGRES_PASSWORD: dingogo, POSTGRES_DB: dingogo }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgres://dingogo:dingogo@localhost:5432/dingogo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck --workspaces --if-present
      - run: npm run db:reset -w services/api
      - run: npm test -w services/api
      - run: npm run build --workspaces --if-present
      # Browser smoke test (rider books, driver accepts and completes, admin approves a car) against the Vercel build:
      # the built apps and the bundled serverless API on a freshly seeded database.
      - run: node scripts/build-vercel.mjs
      - name: Install Playwright (not a project dependency)
        run: npm i --no-save --no-package-lock playwright@1.63.0 && npx playwright install --with-deps chromium
      - run: npm run db:reset -w services/api
      - run: npm run smoke
        env: { SMOKE_SHOTS: smoke-shots }
      - if: failure()
        uses: actions/upload-artifact@v4
        with: { name: smoke-screenshots, path: smoke-shots, if-no-files-found: ignore }
