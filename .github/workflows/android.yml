name: Android apps
on:
  push:
    branches: [dingogo, main]
    paths: ['apps/rider/**', 'apps/driver/**', 'packages/shared/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: android-${{ github.ref }}, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: { app: [rider, driver] }
    env:
      VITE_API_URL: https://dingogo-steel.vercel.app/api
      VITE_WEB_URL: https://dingogo-steel.vercel.app
      VITE_REALTIME: 'off'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm ci --include=dev
      - name: Build web bundle
        working-directory: apps/${{ matrix.app }}
        run: npx vite build
      - name: Sync into Android project
        working-directory: apps/${{ matrix.app }}
        run: npx cap sync android
      - name: Gradle build (debug APK, installable for testing)
        working-directory: apps/${{ matrix.app }}/android
        run: chmod +x gradlew && ./gradlew --no-daemon assembleDebug
      - name: Rename APK
        run: cp apps/${{ matrix.app }}/android/app/build/outputs/apk/debug/app-debug.apk dingogo-${{ matrix.app }}.apk
      - uses: actions/upload-artifact@v4
        with: { name: dingogo-${{ matrix.app }}-apk, path: dingogo-${{ matrix.app }}.apk }
      - name: Publish to the "android-latest" release
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          gh release view android-latest >/dev/null 2>&1 || gh release create android-latest --prerelease --target ${{ github.sha }} --title "DingoGo Android test builds" --notes "Debug APKs for testing. Install on Android by allowing installs from this source. Store releases need a signing key."
          gh release upload android-latest dingogo-${{ matrix.app }}.apk --clobber
