name: Android apps
on:
  push:
    branches: [dingogo, main]
    paths: ['apps/rider/**', 'apps/driver/**', 'packages/shared/**', 'android-signing/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [rider, driver]
    env:
      VITE_API_URL: https://dingogo-steel.vercel.app/api
      VITE_WEB_URL: https://dingogo-steel.vercel.app
      VITE_REALTIME: 'off'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci --include=dev
      - name: Build web bundle
        working-directory: apps/${{ matrix.app }}
        run: npx vite build
      - name: Sync into Android project
        working-directory: apps/${{ matrix.app }}
        run: npx cap sync android
      - name: Gradle build (release APK, signed with the shared test key)
        working-directory: apps/${{ matrix.app }}/android
        run: chmod +x gradlew && ./gradlew --no-daemon assembleRelease
      - name: Rename APK
        run: cp apps/${{ matrix.app }}/android/app/build/outputs/apk/release/app-release.apk dingogo-${{ matrix.app }}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: dingogo-${{ matrix.app }}-apk
          path: dingogo-${{ matrix.app }}.apk
      - name: Publish to the "android-latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view android-latest >/dev/null 2>&1 || gh release create android-latest --prerelease --target ${{ github.sha }} --title "DingoGo Android test builds" --notes "Android test builds of the DingoGo rider and driver apps. Download the APK on your phone, open it and allow installs from your browser. New builds install over old ones."
          gh release upload android-latest dingogo-${{ matrix.app }}.apk --clobber
